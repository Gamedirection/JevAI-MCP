services:
   jevai-mcp:
      build:
         context: .
         args:
            APP_VERSION: "1.0.0"
      image: jevai-mcp:1.0.0
      restart: unless-stopped
      ports:
         - "8080:8080" # dashboard + API + /mcp on the same port
         - "3001:3001" # standalone MCP port for agents that connect directly
      environment:
         DEFAPI_API_KEY: ${DEFAPI_API_KEY:-}
         JEV_MODEL: ${JEV_MODEL:-typesafe/jev-1.13}
         LOG_LEVEL: ${LOG_LEVEL:-info}
         PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
         PUBLIC_PROTOCOL: ${PUBLIC_PROTOCOL:-http}
         PUBLIC_MCP_PORT: ${PUBLIC_MCP_PORT:-3001}
      volumes:
         - jevai-data:/data
      healthcheck:
         test:
            ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
         interval: 30s
         timeout: 5s
         retries: 3
         start_period: 10s

volumes:
   jevai-data:
