{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "jevai-mcp.fullname" . }}
  labels:
        {{- include "jevai-mcp.labels" . | nindent 4 }}
   {{- with .Values.ingress.annotations }}
  annotations:
        {{- toYaml . | nindent 4 }}
   {{- end }}
spec:
   {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
   {{- end }}
   {{- with .Values.ingress.tls }}
  tls:
        {{- toYaml . | nindent 4 }}
   {{- end }}
  rules:
    - host: {{ required "ingress.hostname is required when ingress.enabled is true" .Values.ingress.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "jevai-mcp.fullname" . }}
                port:
                  number: {{ .Values.service.httpPort }}
{{- end }}
