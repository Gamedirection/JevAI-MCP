{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
   name: {{ default (include "jevai-mcp.fullname" .) .Values.serviceAccount.name }}
   labels:
       {{- include "jevai-mcp.labels" . | nindent 6 }}
   {{- with .Values.serviceAccount.annotations }}
   annotations:
       {{- toYaml . | nindent 6 }}
   {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
