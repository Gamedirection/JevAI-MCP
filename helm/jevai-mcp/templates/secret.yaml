{{- include "jevai-mcp.validate" . }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
   name: {{ include "jevai-mcp.secretName" . }}
   labels:
      {{- include "jevai-mcp.labels" . | nindent 6 }}
type: Opaque
stringData:
    {{ .Values.apiKeySecretKey }}: {{ required "jevaiApiKey is required when existingSecret is not set" .Values.jevaiApiKey | quote }}
{{- end }}
