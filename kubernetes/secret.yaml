apiVersion: v1
kind: Secret
metadata:
   name: jevai-mcp-secrets
   labels:
      app.kubernetes.io/name: jevai-mcp
type: Opaque
stringData:
   # Replace REPLACE_WITH_YOUR_KEY with your DefAPI key (starts with dk-).
   # kubectl apply -f this file, or better: create it with
   #   kubectl create secret generic jevai-mcp-secrets --from-literal=DEFAPI_API_KEY=dk-...
   DEFAPI_API_KEY: REPLACE_WITH_YOUR_KEY
