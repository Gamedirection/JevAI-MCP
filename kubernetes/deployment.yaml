apiVersion: apps/v1
kind: Deployment
metadata:
   name: jevai-mcp
   labels:
      app.kubernetes.io/name: jevai-mcp
      app.kubernetes.io/component: server
spec:
   replicas: 1 # SQLite lives on a ReadWriteOnce volume; keep one replica.
   strategy:
      type: Recreate
   selector:
      matchLabels:
         app.kubernetes.io/name: jevai-mcp
   template:
      metadata:
         labels:
            app.kubernetes.io/name: jevai-mcp
            app.kubernetes.io/component: server
      spec:
         securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
               type: RuntimeDefault
         containers:
             - name: jevai-mcp
               image: jevai-mcp:1.0.0
               imagePullPolicy: IfNotPresent
               ports:
                    - name: http
                      containerPort: 8080
                    - name: mcp
                      containerPort: 3001
               env:
                    - name: DEFAPI_API_KEY
                      valueFrom:
                         secretKeyRef:
                            name: jevai-mcp-secrets
                            key: DEFAPI_API_KEY
                    - name: DATABASE_PATH
                      value: /data/jevai.db
                    - name: PUBLIC_PROTOCOL
                      value: http
                    - name: PUBLIC_HOSTNAME
                      value: jevai-mcp.your-cluster.internal
                    - name: PUBLIC_MCP_PORT
                      value: "3001"
                    - name: LOG_LEVEL
                      value: info
               envFrom: []
               volumeMounts:
                    - name: data
                      mountPath: /data
               startupProbe:
                    httpGet:
                       path: /health/live
                       port: http
                    failureThreshold: 30
                    periodSeconds: 2
               livenessProbe:
                    httpGet:
                       path: /health/live
                       port: http
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 3
               readinessProbe:
                    httpGet:
                       path: /health/ready
                       port: http
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
               resources:
                    requests:
                       cpu: 100m
                       memory: 192Mi
                    limits:
                       cpu: "1"
                       memory: 512Mi
               securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                       drop: ["ALL"]
         volumes:
             - name: data
               persistentVolumeClaim:
                  claimName: jevai-mcp-data
