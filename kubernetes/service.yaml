apiVersion: v1
kind: Service
metadata:
   name: jevai-mcp
   labels:
      app.kubernetes.io/name: jevai-mcp
spec:
   type: ClusterIP
   selector:
      app.kubernetes.io/name: jevai-mcp
   ports:
       - name: http
         port: 8080
         targetPort: http
       - name: mcp
         port: 3001
         targetPort: mcp
